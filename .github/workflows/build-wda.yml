name: build-wda
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout official WebDriverAgent source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          path: wda
      - name: Inspect source
        run: |
          echo "=== top of wda ==="
          ls -la wda | head -40
          echo "=== projects ==="
          find wda -maxdepth 2 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) | head
          echo "=== schemes ==="
          cd wda && (xcodebuild -list 2>&1 | head -60 || true)
      - name: Build
        run: |
          cd wda
          set -o pipefail
          xcodebuild build-for-testing -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build 2>&1 | tee ../build.log | tail -30
      - name: Find app and package
        if: always()
        run: |
          echo "=== search *.app ==="
          find wda/build -name "*.app" 2>/dev/null | tee apps.txt || true
          APP=$(find wda/build -name "WebDriverAgentRunner-Runner.app" 2>/dev/null | head -1)
          echo "APP=$APP"
          if [ -n "$APP" ]; then
            mkdir -p Payload
            cp -r "$APP" Payload/
            zip -qry WebDriverAgent-unsigned.ipa Payload
            ls -la WebDriverAgent-unsigned.ipa
          else
            echo "no WebDriverAgentRunner-Runner.app built" > NO-APP.txt
          fi
      - name: Release with logs
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wda-2
          name: WDA build 2
          fail_on_unmatched_files: false
          files: |
            WebDriverAgent-unsigned.ipa
            build.log
            apps.txt
            NO-APP.txt
