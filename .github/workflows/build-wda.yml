name: build-wda
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout official WebDriverAgent source
        uses: actions/checkout@v4
        with:
          repository: appium/WebDriverAgent
          ref: master
          path: wda
      - name: Show source commit
        run: cd wda && git log -1 --format="%H %ci"
      - name: Build (unsigned)
        run: |
          cd wda
          xcodebuild build-for-testing -project WebDriverAgent.xcodeproj -scheme WebDriverAgentRunner -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -derivedDataPath build | tail -20
      - name: Package unsigned ipa
        run: |
          mkdir -p Payload
          cp -r "wda/build/Build/Products/Debug-iphoneos/WebDriverAgentRunner-Runner.app" Payload/
          zip -qry WebDriverAgent-unsigned.ipa Payload
          ls -la WebDriverAgent-unsigned.ipa
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: wda-1
          name: WebDriverAgent unsigned
          files: WebDriverAgent-unsigned.ipa
